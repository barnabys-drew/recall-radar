# Re-bakes the aisle app every morning.
#
# The page carries its own copy of the recall corpus, which is the only way it
# can work in a grocery store with no signal - but it also means the data is
# exactly as old as the last build. This runs the same build.py a developer
# runs, commits the result, and the service worker hands it to anyone who opens
# the app next.
#
# build.py refuses to write a page that lost an agency, so a bad fetch fails
# this job loudly and leaves yesterday's good build serving. That is deliberate:
# stale-but-complete beats fresh-but-missing-the-meat.

name: Rebuild recall data

on:
  schedule:
    - cron: "20 11 * * *"      # 06:20 Chicago in summer, 05:20 in winter
  workflow_dispatch:            # the "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:                      # rebuild whenever the app itself changes
      - template.html
      - web/matcher.js
      - build.py
      - sw-template.js

concurrency:
  group: rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the parity test needs Node, and it is the test that matters most
      # here: this job is what puts the ported matcher in front of people.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: python3 -m unittest discover -s tests -t .

      # Must run before build.py overwrites the page: this is the record of
      # what was already published, and it is the only thing that stops the
      # Discord notice from re-announcing the whole corpus.
      - name: Note what is already published
        run: python3 notify.py snapshot --out "${{ runner.temp }}/before.json"

      - name: Sync and rebuild
        id: build
        run: python3 build.py

      # Someone can land a commit while the sync is running, which loses the
      # push. Everything under docs/ is generated, so the resolution is never a
      # merge: take their main, bake the page again on top of it, and retry. The
      # re-bake reuses the database this job already synced, so no retry costs a
      # second round trip to FDA and USDA.
      - name: Commit the new build
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage() {
            git add docs
            if git diff --cached --quiet; then
              echo "Nothing changed."
              return 1
            fi
            git commit -m "Rebuild recall data: ${{ steps.build.outputs.summary }}"
          }

          stage || exit 0
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::warning::Push rejected (attempt $attempt); rebuilding on top of main."
            git fetch origin main
            git reset --hard origin/main
            python3 build.py --no-sync
            stage || exit 0
          done
          echo "::error::Could not push after three attempts."
          exit 1

      # Only after the push: a notice about a build that never shipped points
      # at an app that does not have the recall in it yet. Nothing here fails
      # the job - the app is the product, and Discord is a convenience on top.
      # A fork without the secret configured simply prints and moves on.
      - name: Announce new recalls on Discord
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 notify.py post --before "${{ runner.temp }}/before.json"
